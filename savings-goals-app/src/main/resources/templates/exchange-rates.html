<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Rates</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="exchange-rates-page">

<!-- Animated Currency Background -->
<div class="currency-background">
    <span class="currency-symbol">€</span>
    <span class="currency-symbol">$</span>
    <span class="currency-symbol">£</span>
    <span class="currency-symbol">¥</span>
    <span class="currency-symbol">€</span>
    <span class="currency-symbol">$</span>
    <span class="currency-symbol">£</span>
    <span class="currency-symbol">¥</span>
</div>

<div class="exchange-rates-container">

    <!-- Header Section -->
    <div class="exchange-header">
        <h1>Exchange Rates</h1>

        <div style="margin: 20px 0;">
            <a th:href="@{/home}" class="btn secondary">Back to Home</a>
        </div>

        <p class="exchange-subtitle">
            Currency reference rates and conversion calculator
        </p>

        <p th:if="${param.deleted}"
           style="margin:18px auto 0;
                  max-width:600px;
                  padding:12px 16px;
                  background:#dcfce7;
                  color:#166534;
                  border:1px solid #86efac;
                  border-radius:8px;
                  font-weight:700;">
            Exchange rate deleted successfully.
        </p>
    </div>

    <!-- Rates Table Card -->
    <div class="card card-large">

        <h2 class="card-title">Current Rates</h2>

        <div class="table-wrapper">

            <table class="exchange-table">

                <thead>
                <tr>
                    <th>Base Currency</th>
                    <th>Target Currency</th>
                    <th>Rate</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="exchangeRate : ${exchangeRates}"
                    class="table-row">

                    <td class="currency-code"
                        th:text="${exchangeRate.baseCurrency}">
                    </td>

                    <td class="currency-code"
                        th:text="${exchangeRate.targetCurrency}">
                    </td>

                    <td class="rate-value"
                        th:text="${#numbers.formatDecimal(exchangeRate.rate, 1, 5)}">
                    </td>

                    <td style="text-align:center;">

                        <form th:action="@{/exchange-rates/{id}/delete(id=${exchangeRate.id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this exchange rate?');">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    style="border:none;
                                           border-radius:8px;
                                           padding:9px 14px;
                                           background:#dc2626;
                                           color:white;
                                           font-weight:700;
                                           cursor:pointer;">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(exchangeRates)}"
                    class="empty-row">

                    <td colspan="4">
                        No exchange rates available
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Forms Section -->
    <div class="forms-grid">

        <!-- Add Exchange Rate Card -->
        <div class="card">

            <h2 class="card-title">Add Exchange Rate</h2>

            <form th:action="@{/exchange-rates}"
                  th:object="${exchangeRate}"
                  method="post"
                  class="form-content">

                <div class="form-group">
                    <label for="baseCurrency">Base Currency</label>

                    <input type="text"
                           id="baseCurrency"
                           value="EUR"
                           readonly
                           class="input-readonly">

                    <input type="hidden"
                           th:field="*{baseCurrency}"
                           value="EUR">
                </div>

                <div class="form-group">
                    <label for="targetCurrency">
                        Target Currency
                    </label>

                    <input type="text"
                           id="targetCurrency"
                           th:field="*{targetCurrency}"
                           placeholder="e.g., USD, GBP, JPY"
                           required>
                </div>

                <div class="form-group">
                    <label for="rate">
                        Exchange Rate
                    </label>

                    <input type="number"
                           id="rate"
                           th:field="*{rate}"
                           step="0.000001"
                           placeholder="0.00000"
                           required>
                </div>

                <button type="submit"
                        class="btn-submit">
                    Add Rate
                </button>

            </form>

        </div>

        <!-- Calculate Exchange Rate Card -->
        <div class="card">

            <h2 class="card-title">Calculate Rate</h2>

            <form th:action="@{/exchange-rates/calculate}"
                  method="get"
                  class="form-content">

                <div class="form-group">
                    <label for="baseCurrencyCalc">
                        Base Currency
                    </label>

                    <input type="text"
                           id="baseCurrencyCalc"
                           name="baseCurrency"
                           placeholder="e.g., EUR"
                           required>
                </div>

                <div class="form-group">
                    <label for="targetCurrencyCalc">
                        Target Currency
                    </label>

                    <input type="text"
                           id="targetCurrencyCalc"
                           name="targetCurrency"
                           placeholder="e.g., USD"
                           required>
                </div>

                <button type="submit"
                        class="btn-submit">
                    Calculate
                </button>

            </form>

            <div th:if="${calculatedRate != null}"
                 class="result-box">

                <p class="result-label">
                    Conversion Rate:
                </p>

                <p class="result-value"
                   th:text="${#numbers.formatDecimal(calculatedRate, 1, 5)}">
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
